name: Caffio SaaS CI/CD Pipeline

# Tests run on EVERY branch, deployment still only from main/master.
#
# The suite stopped compiling at the billing redesign and stayed broken for months. It was not that
# tests were skipped — `mvnw clean package` runs them — but that this workflow only fired on
# main/master, and the work happens on feature branches and worktrees. The breakage was invisible
# until it merged, which is the one place it is most expensive to find.
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  test-frontend:
    name: Build & Test React Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Verify Vite Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://api.yourdomain.com/api
      - name: Verify Frontend Lint
        run: cd frontend && npm run lint

  test-backend:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      # `package` runs the surefire tests; naming the phase explicitly first means a red suite
      # reports as "tests failed" rather than as a packaging error.
      - name: Run test suite
        run: ./mvnw --batch-mode clean test

      - name: Package JAR
        run: ./mvnw --batch-mode package -DskipTests

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker-build:
    name: Build Production Docker Image
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: caffio-api:latest
