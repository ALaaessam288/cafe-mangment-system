# Production profile - active when the app is launched by the packaged Electron shell
# (main.js passes --spring.profiles.active=prod). Everything here exists to undo a
# development default that is actively harmful on a customer's machine.

# show-sql=true writes every statement to backend.log, which is opened in append mode and never
# rotated - on a busy cafe that is hundreds of megabytes a month.
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.example.cafemangmentsystem=INFO

# Devtools is not on the production classpath, but if it ever leaks in via a transitive
# dependency an automatic restart mid-service is the last thing a POS terminal needs.
spring.devtools.restart.enabled=false

# Only the health endpoint is needed - main.js polls it to decide when to show the window.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# No API docs surface in a shipped desktop build.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
