spring.application.name=cafe-mangment-system
spring.datasource.url=jdbc:sqlite:${user.home}/.cafepos/cafe.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Off deliberately: controllers only ever touch DTOs assembled inside @Transactional service
# methods, never raw entities, so there's no lazy-loading-during-serialization need for this -
# and leaving it on made Hibernate's per-tenant session resolution unreliable (a session could
# get opened, and its tenant identity fixed, before request-specific tenant context was set).
spring.jpa.open-in-view=false
# JWT - dev-only secret, override via env var (JWT_SECRET) in real deployments
jwt.secret=Szd9DkC9S4d3x0gTxTLgRc406ddhAa9gabPrzIZzAAuXUfZpaclWmmsMaLioyEj1
# Short-lived on purpose - refresh tokens (see below) are what makes that tolerable
jwt.expiration-ms=900000
# 7 days - revocable/rotatable, unlike the access token
jwt.refresh-expiration-ms=604800000

# Ops-only key gating POST /api/platform/tenants (X-Platform-Api-Key header) - dev-only value,
# override via env var (APP_PLATFORM_PROVISIONING_KEY) in real deployments
app.platform.provisioning-key=dev-only-platform-key-change-me

# Never leak stack traces to API clients (devtools overrides the framework default otherwise)
spring.web.error.include-stacktrace=never