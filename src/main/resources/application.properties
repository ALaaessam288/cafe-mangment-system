spring.application.name=cafe-mangment-system

# Datasource configuration with environment variable overrides for SaaS Cloud production
# Railway deployment env vars:
#   DATABASE_URL=<Railway Postgres URL>              (postgresql:// is auto-converted to jdbc:postgresql:// at startup)
#   DATABASE_DRIVER=org.postgresql.Driver
#   JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
#   JPA_DDL_AUTO=validate                             (Flyway owns the schema; do not use update/create in prod)
#   FLYWAY_ENABLED=true
#   JWT_SECRET=<strong random secret>
#   APP_PLATFORM_PROVISIONING_KEY=<ops key>
#   CORS_ALLOWED_ORIGINS=<deployed frontend origin(s)>
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:${user.home}/.cafepos/cafe.db?journal_mode=WAL&busy_timeout=5000}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.community.dialect.SQLiteDialect}

spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT signing key & expiration (Override via JWT_SECRET in production)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Ops-only key gating POST /api/platform/tenants
app.platform.provisioning-key=${APP_PLATFORM_PROVISIONING_KEY:}

# First platform owner. NO DEFAULTS ON PURPOSE - unset means no account is created, and the log
# says so. A super admin used to be seeded with its password written into the source, which put
# the platform owner's credentials in every build artefact and every copy of the installer.
# Only used when no SUPER_ADMIN exists yet; it never resets an existing one.
app.platform.admin-username=${APP_PLATFORM_ADMIN_USERNAME:}
app.platform.admin-password=${APP_PLATFORM_ADMIN_PASSWORD:}
app.platform.admin-full-name=${APP_PLATFORM_ADMIN_FULL_NAME:Platform Owner}

# Unsafe legacy schema/data repair and demo-account seeding is disabled by default.
app.legacy-bootstrap.enabled=${APP_LEGACY_BOOTSTRAP_ENABLED:false}

# CORS Allowed Origins (Comma-separated, e.g. https://app.yourdomain.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# Error handling
spring.web.error.include-stacktrace=never

# Devtools restart settings
spring.devtools.restart.poll-interval=3000
spring.devtools.restart.quiet-period=2000
# Server port — Railway injects $PORT; fall back to 8080 locally
server.port=${PORT:8080}

# WhatsApp Gateway Automation Configuration
whatsapp.gateway.enabled=${WHATSAPP_GATEWAY_ENABLED:false}
whatsapp.gateway.provider=${WHATSAPP_PROVIDER:GENERIC_HTTP}
whatsapp.gateway.api-url=${WHATSAPP_API_URL:https://api.ultramsg.com}
whatsapp.gateway.instance-id=${WHATSAPP_INSTANCE_ID:}
whatsapp.gateway.token=${WHATSAPP_API_TOKEN:}
whatsapp.gateway.sender-number=${WHATSAPP_SENDER_NUMBER:01061967618}

# ── Billing / subscription policy ──────────────────────────────────────────────
# Free trial length for a self-service signup.
app.billing.trial-days=${BILLING_TRIAL_DAYS:14}
# Days of continued WRITE access after a period lapses. A cafe must never lose the till
# mid-shift because an invoice went unpaid overnight; after this window it goes read-only.
app.billing.grace-days=${BILLING_GRACE_DAYS:5}
# Days before expiry at which the owner is warned (descending).
app.billing.warning-days=${BILLING_WARNING_DAYS:7,3,1}
app.billing.invoice-due-days=${BILLING_INVOICE_DUE_DAYS:7}
app.billing.invoice-prefix=${BILLING_INVOICE_PREFIX:CAF}
# The hourly lifecycle pass. Access decisions never wait for it - it persists transitions and
# sends notifications. A single-cafe desktop install has nothing to age, so it ships disabled there.
app.billing.scheduler-enabled=${BILLING_SCHEDULER_ENABLED:true}
app.billing.scheduler-interval-ms=${BILLING_SCHEDULER_INTERVAL_MS:3600000}

# ── Bank transfer details shown to customers upgrading ────────────────────────
# The platform operator's own account. Configuration, never constants: these must not be compiled
# into a build that ships to customers' machines, and they change without a release.
app.billing.bank.bank-name=${BILLING_BANK_NAME:}
app.billing.bank.account-name=${BILLING_BANK_ACCOUNT_NAME:}
app.billing.bank.account-number=${BILLING_BANK_ACCOUNT_NUMBER:}
app.billing.bank.iban=${BILLING_BANK_IBAN:}
app.billing.bank.swift=${BILLING_BANK_SWIFT:}
app.billing.bank.wallet=${BILLING_BANK_WALLET:}
app.billing.bank.support-phone=${BILLING_SUPPORT_PHONE:}
app.billing.bank.instructions=${BILLING_BANK_INSTRUCTIONS:}
