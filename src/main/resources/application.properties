spring.application.name=cafe-mangment-system

# Datasource configuration with environment variable overrides for SaaS Cloud production
# Railway deployment env vars:
#   DATABASE_URL=<Railway Postgres URL>              (postgresql:// is auto-converted to jdbc:postgresql:// at startup)
#   DATABASE_DRIVER=org.postgresql.Driver
#   JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
#   JPA_DDL_AUTO=validate                             (Flyway owns the schema; do not use update/create in prod)
#   FLYWAY_ENABLED=true
#   JWT_SECRET=<strong random secret>
#   APP_PLATFORM_PROVISIONING_KEY=<ops key>
#   CORS_ALLOWED_ORIGINS=<deployed frontend origin(s)>
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:${user.home}/.cafepos/cafe.db?journal_mode=WAL&busy_timeout=5000}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.community.dialect.SQLiteDialect}

spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT signing key & expiration (Override via JWT_SECRET in production)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Ops-only key gating POST /api/platform/tenants
app.platform.provisioning-key=${APP_PLATFORM_PROVISIONING_KEY:}

# CORS Allowed Origins (Comma-separated, e.g. https://app.yourdomain.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# Error handling
spring.web.error.include-stacktrace=never

# Devtools restart settings
spring.devtools.restart.poll-interval=3000
spring.devtools.restart.quiet-period=2000
# Server port — Railway injects $PORT; fall back to 8080 locally
server.port=${PORT:8080}

# WhatsApp Gateway Automation Configuration
whatsapp.gateway.enabled=${WHATSAPP_GATEWAY_ENABLED:true}
whatsapp.gateway.provider=${WHATSAPP_PROVIDER:GENERIC_HTTP}
whatsapp.gateway.api-url=${WHATSAPP_API_URL:https://api.ultramsg.com}
whatsapp.gateway.instance-id=${WHATSAPP_INSTANCE_ID:}
whatsapp.gateway.token=${WHATSAPP_API_TOKEN:}
whatsapp.gateway.sender-number=${WHATSAPP_SENDER_NUMBER:01061967618}
