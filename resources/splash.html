<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CafePOS – جاري التحميل</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 400px;
    height: 300px;
    background: linear-gradient(135deg, #1a0a00 0%, #2d1200 50%, #1a0a00 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    color: #f5c842;
    overflow: hidden;
    border-radius: 16px;
    -webkit-app-region: no-drag;
  }

  .logo {
    font-size: 56px;
    margin-bottom: 12px;
    animation: float 2.5s ease-in-out infinite;
  }

  .app-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #f5c842;
    text-shadow: 0 0 20px rgba(245, 200, 66, 0.5);
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 13px;
    color: rgba(245, 200, 66, 0.6);
    letter-spacing: 1px;
    margin-bottom: 32px;
  }

  .loader-bar {
    width: 200px;
    height: 4px;
    background: rgba(245, 200, 66, 0.15);
    border-radius: 99px;
    overflow: hidden;
  }

  .loader-fill {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #f5c842, #ffaa00);
    border-radius: 99px;
    animation: slide 1.5s ease-in-out infinite;
  }

  .status {
    margin-top: 14px;
    font-size: 12px;
    color: rgba(245, 200, 66, 0.5);
    letter-spacing: 0.5px;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }
</style>
</head>
<body>
  <div class="logo">☕</div>
  <div class="app-name">Cafe POS</div>
  <div class="tagline">نظام إدارة الكافيه</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div class="status">جاري تشغيل النظام...</div>
</body>
</html>
